apiVersion: v1
kind: Pod
metadata:
  name: app1
  labels:
    app: app1
spec:
  containers:
    - name: app1
      image: hashicorp/http-echo:1.0
      args:
        - "-listen=:8000"
        - "-text=hello world 1"
      ports:
        - name: http
          containerPort: 8000

