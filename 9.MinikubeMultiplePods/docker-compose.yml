services:
  registration-service:
    container_name: registration-container
    image: danan22/registration-service:v1

    build:
      context: ./registration-service
    ports:
      - "5001:5001"
    env_file:
      - ./registration-service/.env
    restart: unless-stopped

  login-service:
    build:
      context: ./login-service
    image: danan22/login-service:v1
    container_name: login-container
    ports:
      - "5002:5002"
    env_file:
      - ./login-service/.env
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    image: danan22/api-gateway:v1
    container_name: api-gateway-container
    ports:
      - "4000:4000"
    environment:
      LOGIN_SERVICE_URL: http://login-service:5002
      REGISTRATION_SERVICE_URL: http://registration-service:5001
    depends_on:
      - registration-service
      - login-service
    restart: unless-stopped
