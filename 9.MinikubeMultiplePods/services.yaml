apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-login
  ports:
    - name: gateway
      protocol: TCP
      port: 4000
      targetPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  name: login-service
spec:
  type: ClusterIP
  selector:
    app: gateway-login
  ports:
    - name: login
      protocol: TCP
      port: 5002
      targetPort: 5002

---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
spec:
  type: ClusterIP
  selector:
    app: registration
  ports:
    - name: registration
      protocol: TCP
      port: 5001
      targetPort: 5001
