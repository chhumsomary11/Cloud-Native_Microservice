apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: gateway-registration
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: login-service
spec:
  type: ClusterIP
  selector:
    app: login
  ports:
    - name: http
      port: 5002
      targetPort: 5002

